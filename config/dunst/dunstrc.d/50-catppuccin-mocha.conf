# Catppuccin Mocha (Lavender) theme drop-in for Dunst.
# Palette:
#   base     #1e1e2e    surface2 #585b70    text     #cdd6f4
#   subtext1 #bac2de    lavender #b4befe    red      #f38ba8

[global]
    font = JetBrains Mono 10
    icon_theme = "Papirus-Dark, Adwaita"
    frame_color = "#b4befe"
    separator_color = frame

[urgency_low]
    background = "#1e1e2ee6"
    foreground = "#bac2de"
    frame_color = "#585b70"
    highlight = "#b4befe"

[urgency_normal]
    background = "#1e1e2ee6"
    foreground = "#cdd6f4"
    frame_color = "#b4befe"
    highlight = "#b4befe"

[urgency_critical]
    background = "#1e1e2ef2"
    foreground = "#cdd6f4"
    frame_color = "#f38ba8"
    highlight = "#f38ba8"
