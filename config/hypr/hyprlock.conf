source = $HOME/.config/hypr/catppuccin-mocha-hyprlock.conf

$accent = $lavender
$font = JetBrains Mono

general {
  hide_cursor = false
}

background {
  monitor =
  reload_cmd = $HOME/.local/bin/rotate-catppuccin-wallpaper --current
  reload_time = 5
  crossfade_time = 0.35
  blur_passes = 0
  color = $base
}

label {
  monitor =
  text = cmd[update:1000] /usr/bin/date '+<b>%H:%M</b>%n<span size="26%%" weight="bold">%A, %-d %B %Y</span>'
  color = $text
  font_size = 58
  font_family = $font
  text_align = right
  position = -40, -26
  halign = right
  valign = top
  shadow_passes = 2
}

image {
  monitor =
  path = /usr/share/sddm/themes/catppuccin-mocha-lavender-desktop/assets/defaultIcon.png
  size = 76
  rounding = -1
  border_size = 2
  border_color = $accent
  position = 0, 95
  halign = center
  valign = center
  shadow_passes = 2
}

label {
  monitor =
  text = $USER
  color = $text
  font_size = 15
  font_family = $font
  position = 0, 42
  halign = center
  valign = center
  shadow_passes = 2
}

input-field {
  monitor =
  size = 280, 38
  outline_thickness = 1
  rounding = 4
  dots_size = 0.18
  dots_spacing = 0.25
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  font_family = $font
  fade_on_empty = false
  placeholder_text = Password
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL</i>
  capslock_color = $yellow
  position = 0, 0
  halign = center
  valign = center
  shadow_passes = 2
}

label {
  monitor =
  text = cmd[update:2000] $HOME/.local/bin/fuzzyland media track
  color = $subtext1
  font_size = 13
  font_family = $font
  position = 0, -49
  halign = center
  valign = center
  shadow_passes = 2
}

label {
  monitor =
  text = cmd[update:2000] $HOME/.local/bin/fuzzyland media previous
  color = $accent
  font_size = 19
  font_family = Noto Sans Symbols 2
  position = -40, -82
  halign = center
  valign = center
  onclick = $HOME/.local/bin/fuzzyland media prev
  shadow_passes = 2
}

label {
  monitor =
  text = cmd[update:2000] $HOME/.local/bin/fuzzyland media toggle
  color = $accent
  font_size = 19
  font_family = Noto Sans Symbols 2
  position = 0, -82
  halign = center
  valign = center
  onclick = $HOME/.local/bin/fuzzyland media play-pause
  shadow_passes = 2
}

label {
  monitor =
  text = cmd[update:2000] $HOME/.local/bin/fuzzyland media next
  color = $accent
  font_size = 19
  font_family = Noto Sans Symbols 2
  position = 40, -82
  halign = center
  valign = center
  onclick = $HOME/.local/bin/fuzzyland media skip
  shadow_passes = 2
}

label {
  monitor =
  text = Layout $LAYOUT
  color = $subtext1
  font_size = 12
  font_family = $font
  position = 34, 28
  halign = left
  valign = bottom
  shadow_passes = 2
}
