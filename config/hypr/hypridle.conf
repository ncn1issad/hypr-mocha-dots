# Hypridle configuration for Hyprland (0.57+ Lua dispatchers)
# Managed via systemd user service: systemctl --user enable --now hypridle.service
# Waybar's idle_inhibitor module inhibits these listeners over Wayland idle-inhibit.

general {
    lock_cmd = pidof hyprlock || hyprlock                              # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                           # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake display without extra keypress after resume
    inhibit_sleep = 3                                                  # wait until screen is locked before sleeping
    ignore_dbus_inhibit = false                                        # respect D-Bus idle inhibitors (browsers, media)
    ignore_systemd_inhibit = false                                     # respect systemd-inhibit locks
}

# Dim internal backlight after 2.5 min (only if currently brighter than 10%)
listener {
    timeout = 150
    on-timeout = $HOME/.local/bin/fuzzyland backlight internal dim
    on-resume = $HOME/.local/bin/fuzzyland backlight internal restore
}

# Lock session after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off monitors (DPMS off) after 5.5 min
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && $HOME/.local/bin/fuzzyland backlight internal restore
}

# Suspend system after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
